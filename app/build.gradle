    compileSdk 34

    defaultConfig {
        applicationId "com.custom.liquidglass"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
    }
